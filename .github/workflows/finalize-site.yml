name: Finalize SignalSourced website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update website and validate required links
        run: python scripts/finalize_site.py
      - name: Commit website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Finalize contact, booking and policy links"
          git push
