name: Set Growth Partner price to 6000
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-growth-price-6000.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update price
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '$3,000 <span style="font-size:.36em;letter-spacing:0">/ 6 months</span>'
          new = '$6,000 <span style="font-size:.36em;letter-spacing:0">/ 6 months</span>'
          if old not in s:
              raise SystemExit('Expected $3,000 price string not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m 'Set Growth Partner price to $6,000'
          git push
