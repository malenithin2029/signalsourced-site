name: Apply Growth Partner positioning

on:
  push:
    paths:
      - '.github/workflows/growth-partner-positioning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage positioning
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          if 'Know what’s coming next quarter' in s:
              print('Growth Partner positioning already applied.')
              raise SystemExit(0)

          # Meta + schema
          s = s.replace('<title>SignalSourced | Signal-Based Lead Generation for B2B Web Agencies</title>', '<title>SignalSourced | Growth Partner for Founder-Led Web Agencies</title>')
          s = s.replace('SignalSourced helps B2B web design and development agencies find qualified prospects using verified buying signals, decision-maker research and personalized outbound. Explore our 30-day founding pilot.', 'SignalSourced is a 6-month Growth Partner for founder-led web design and development agencies, combining signal-based outbound, founder LinkedIn and live pipeline visibility—with a free Snapshot and optional $750 pilot.')
          s = s.replace('SignalSourced | Signal-Based Lead Generation for B2B Web Agencies', 'SignalSourced | Growth Partner for Founder-Led Web Agencies')
          s = s.replace('Find good-fit accounts with verified signals, research the right decision-makers, and launch thoughtful outbound. Explore the SignalSourced founding pilot.', 'Build a more predictable agency pipeline with signal-based outbound, founder LinkedIn and a visible path from signal to booked call.')
          s = s.replace('SignalSourced | Signal-Based Client Acquisition', 'SignalSourced | Predictable Pipeline for Web Agencies')
          s = s.replace('Relevant B2B prospecting built around fit, verified signals and human-reviewed outreach.', 'A managed Growth Partner for web agencies: signal-based outbound, founder LinkedIn and live pipeline visibility.')
          old_schema = '<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://signalsourced.com/#organization","name":"SignalSourced","url":"https://signalsourced.com/","logo":"https://signalsourced.com/brand-icon.png","sameAs":["https://www.linkedin.com/company/signalsourced/"],"email":"inquiries@signalsourced.com","description":"Signal-based B2B client acquisition for web design and development agencies."},{"@type":"WebSite","@id":"https://signalsourced.com/#website","name":"SignalSourced","url":"https://signalsourced.com/","publisher":{"@id":"https://signalsourced.com/#organization"}},{"@type":"Service","@id":"https://signalsourced.com/#pilot","name":"Signal-Based Pipeline Sprint","serviceType":"B2B prospect research and personalized outbound for web agencies","provider":{"@id":"https://signalsourced.com/#organization"},"description":"A 30-day founding pilot for established B2B web design and development agencies, including ICP definition, signal research, decision-maker research, human-reviewed outreach and reporting.","url":"https://signalsourced.com/#pilot","offers":{"@type":"Offer","price":"750","priceCurrency":"USD","description":"Advertised 30-day founding pilot; subject to acceptance, a separate agreement and agreed client-owned infrastructure costs."}}]}</script>'
          new_schema = '<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://signalsourced.com/#organization","name":"SignalSourced","url":"https://signalsourced.com/","logo":"https://signalsourced.com/brand-icon.png","sameAs":["https://www.linkedin.com/company/signalsourced/"],"email":"inquiries@signalsourced.com","description":"Growth Partner for founder-led web agencies, combining signal-based outbound, founder LinkedIn and live pipeline visibility."},{"@type":"WebSite","@id":"https://signalsourced.com/#website","name":"SignalSourced","url":"https://signalsourced.com/","publisher":{"@id":"https://signalsourced.com/#organization"}},{"@type":"Service","@id":"https://signalsourced.com/#growth-partner","name":"SignalSourced Growth Partner","serviceType":"Managed growth partnership for web design and development agencies","provider":{"@id":"https://signalsourced.com/#organization"},"description":"A 180-day managed Growth Partner engagement combining signal-based outbound, founder LinkedIn support, live pipeline visibility and regular strategy check-ins.","url":"https://signalsourced.com/#growth"},{"@type":"Service","@id":"https://signalsourced.com/#pilot","name":"30-day Pilot","serviceType":"B2B prospect research and personalized outbound for web agencies","provider":{"@id":"https://signalsourced.com/#organization"},"description":"A one-time 30-day entry pilot with curated prospects, signals, decision-makers and personalized outreach.","url":"https://signalsourced.com/#pilot","offers":{"@type":"Offer","price":"750","priceCurrency":"USD","description":"30-day pilot; client-owned data tools or sending infrastructure, if needed, are billed separately at agreed cost."}}]}</script>'
          assert old_schema in s
          s = s.replace(old_schema, new_schema)

          # Nav
          s = s.replace('<a data-nav href="#mission">Mission</a><a data-nav href="#method">Method</a><a data-nav href="#pilot">Pilot</a><a data-nav href="#faq">FAQ</a>', '<a data-nav href="#mission">Mission</a><a data-nav href="#method">Method</a><a data-nav href="#growth">Growth Partner</a><a data-nav href="#faq">FAQ</a>')
          s = s.replace('<a class="btn sm" href="#contact">Apply for pilot ', '<a class="btn sm" href="#contact">Apply for Growth Partner ')
          s = s.replace('<a href="#mission">Mission <span>→</span></a><a href="#method">Method <span>→</span></a><a href="#pilot">Pilot <span>→</span></a><a href="#faq">FAQ <span>→</span></a><a class="btn" href="#contact">Apply for the founding pilot</a>', '<a href="#mission">Mission <span>→</span></a><a href="#method">Method <span>→</span></a><a href="#growth">Growth Partner <span>→</span></a><a href="#snapshot">Free Snapshot <span>→</span></a><a href="#faq">FAQ <span>→</span></a><a class="btn" href="#contact">Apply for Growth Partner</a>')

          # Hero + primary offer. Keep the existing 46s Snapshot video.
          hero_growth = '''<section class="hero" id="home"><div class="wrap hero-grid"><div>
      <div class="eyebrow reveal"><span class="tagmini">For founder-led agencies</span> Predictable pipeline without becoming a spam machine</div>
      <h1 class="reveal" style="--d:1">Know what’s coming next quarter — <span class="accent">without guessing.</span></h1>
      <p class="lead reveal" style="--d:2">SignalSourced is a 6-month Growth Partner for web, design and development agencies. We run signal-based outbound and build your founder LinkedIn so pipeline stops being feast-or-famine.</p>
      <div class="herocta reveal" style="--d:3"><a class="btn" href="#contact">Apply for Growth Partner <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn ghost" href="#snapshot">Get a free Snapshot</a></div>
      <div class="micro reveal" style="--d:4"><span><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Signal-based outbound</span><span><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Founder LinkedIn</span><span><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Live pipeline board</span><span><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Qualified conversations</span></div>
    </div><div class="hero-video reveal" style="--d:2"><video controls playsinline preload="metadata" poster="/snapshot-thumbnail.jpg" aria-label="Watch the SignalSourced Snapshot video"><source src="/snapshot-video.mp4" type="video/mp4" />Your browser does not support this video.</video><div class="video-label"><span>See the free Snapshot in 46 seconds</span><button type="button" class="expand-video" aria-label="Enlarge video">Enlarge video ⛶</button></div></div></div></section>
    <section class="section" id="growth" style="padding-top:38px"><div class="wrap"><div class="head"><div class="kicker reveal">Primary engagement</div><h2 class="reveal" style="--d:1">SignalSourced <span class="accent">Growth Partner</span></h2><p class="sub reveal" style="--d:2">A 180-day managed growth engagement built around one goal: make your pipeline visible, intentional and less dependent on referrals alone.</p></div><div class="price"><div class="pricebox reveal"><span class="tag"><i></i>180 DAYS · LIMITED ONBOARDING</span><div class="amount" style="font-size:clamp(42px,5vw,62px)">$[TBD] <span style="font-size:.36em;letter-spacing:0">/ 6 months</span></div><div class="small" style="margin-top:10px">We take a small number of agencies at a time so research and messaging stay hands-on.</div><ul class="check"><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Signal-based outbound: dated “why now,” decision-maker research, verified or clearly labeled guessed email, and personalized LinkedIn + email</li><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Founder LinkedIn personal branding: content and cadence designed to compound inbound over time</li><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Live pipeline board: signal found → contacted → replied → call booked → proposal</li><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Weekly or biweekly check-ins, with interested replies routed to the founder</li><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Growth Partner guarantee: a defined number of qualified conversations / booked calls, documented in the agreement</li></ul><p class="small" style="margin:-8px 0 20px"><strong>Important:</strong> we guarantee the agreed qualified-conversation / booked-call output—not closed clients or revenue, which depend on your sales process after the call.</p><a class="btn" href="#contact">Apply for Growth Partner <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><p class="small" style="margin:16px 0 0">Client-owned data tools or sending infrastructure, if needed, are billed at agreed cost.</p></div><div class="card fitcard reveal" style="--d:1"><div class="num">Best fit · quick check</div><h3>Built for agencies where one good project matters.</h3><p class="small">Tick what describes your agency today.</p><div class="fitlist"><label class="fit"><input type="checkbox" /><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>2–20 person web design/development agency</label><label class="fit"><input type="checkbox" /><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Typical project value around $5k+</label><label class="fit"><input type="checkbox" /><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Strong delivery, portfolio and case studies</label><label class="fit"><input type="checkbox" /><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Capacity for additional good-fit projects</label><label class="fit"><input type="checkbox" /><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Founder still involved in growth or sales</label><label class="fit"><input type="checkbox" /><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Want a pipeline beyond referrals alone</label></div><div class="fitresult" data-level="low" aria-live="polite"><div class="row"><span>Fit criteria matched</span><b><span id="fit-count">0</span> / 6</b></div><div class="fitbar"><span></span></div><p id="fit-msg">Tick what describes your agency today.</p></div><ul class="nope"><li><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Not designed for brand-new agencies with no proof of delivery</li><li><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Not a fit for low-ticket, high-volume website offers</li></ul></div></div></div></section>'''
          s, n = re.subn(r'<section class="hero" id="home">.*?</section>', hero_growth, s, count=1, flags=re.S)
          assert n == 1, n

          # Snapshot copy: keep free offer separate from paid work.
          s = s.replace('<div class="kicker">A focused starting point</div><h2>Get your free Snapshot.</h2><p>Five potential clients for your agency, the business signals behind each one, and verified contact details. Free, no strings.</p><p>Tell us who you serve so we can make the research relevant. This request is separate from the paid founding pilot.</p>', '<div class="kicker">Free research sample</div><h2>Get your free Snapshot.</h2><p>Five potential clients for your agency, the business signals behind each one, and contact details we can verify from the research available. Free, no strings.</p><p>The Snapshot is research only. Paid work starts with the 30-day Pilot or the 180-day Growth Partner engagement.</p>')

          # Mission / principles
          s = s.replace('Make outbound more <span class="accent">relevant, respectful and useful.</span>', 'Make growth more <span class="accent">visible, relevant and repeatable.</span>')
          s = s.replace('Great agencies should not have to choose between waiting on referrals and becoming a spam machine. Our mission is to help capable web agencies build a more intentional path to new business—one grounded in fit, timing and honest research.', 'Great agencies should not have to guess where next quarter’s work will come from. Our mission is to build a visible path to new business using focused outbound now and founder-led inbound that compounds over time.')
          s = s.replace('<h3>Learn from data</h3><p>We use replies, objections and conversion data to improve the system—not guesswork.</p>', '<h3>Certainty over activity</h3><p>We sell a visible pipeline and qualified conversations—not vanity send volume.</p>')

          # Method: keep six steps, make LinkedIn compounding explicit after Learn.
          s = s.replace('Our method is intentionally simple: understand the economics, define the right accounts, identify credible triggers, find the decision-maker, and write outreach around verified context.', 'Our method stays simple: understand the economics, define the right accounts, identify credible triggers, find the decision-maker, and write outreach around verified context. In parallel, founder LinkedIn compounds attention so months 4–6 are not dependent on cold outbound alone.')
          s = s.replace('<h3>Improve from real market feedback.</h3><p>We review reply quality, objections and conversion points, then refine the ICP, signals and message.</p>', '<h3>Improve from real market feedback — while inbound compounds.</h3><p>We review reply quality, objections and conversion points, refine the ICP, signals and message, and keep the founder LinkedIn cadence running in parallel so attention can compound over the 180-day engagement.</p>')

          # What we do / do not do.
          s = s.replace('Build focused lists, verify context, prioritize stronger opportunities, personalize responsibly and report what the market is telling us.', 'Build focused account sets, verify signals, research decision-makers, run human-reviewed outreach, maintain live pipeline visibility, and support founder LinkedIn content and cadence.')
          s = s.replace('Blast giant scraped lists, fabricate “personalization,” hide behind vanity metrics or promise a meeting count we have not earned.', 'Blast scraped lists, fake personalization, optimize for vanity metrics, or promise closed deals and revenue we do not control.')

          # Demote the $750 offer into a smaller entry option.
          pilot = '''<section class="section" id="pilot" style="padding-top:34px"><div class="wrap"><div class="head"><div class="kicker reveal">Entry option</div><h2 class="reveal" style="--d:1">Want to test the approach first?</h2><p class="sub reveal" style="--d:2">The 30-day Pilot is a one-time way to test SignalSourced before considering the longer Growth Partner engagement.</p></div><div class="card reveal" style="max-width:780px;margin:34px auto 0"><div class="num">30-day Pilot</div><div style="display:flex;align-items:end;gap:14px;flex-wrap:wrap"><div class="amount" style="font-size:clamp(46px,6vw,66px)"><sup>$</sup>750</div><div class="small" style="padding-bottom:8px">one-time · 30 days</div></div><p>Curated research for up to approximately 100 prospects, including signals, decision-makers and personalized outreach for the 30-day test period.</p><ul class="check"><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>ICP and exclusion criteria</li><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Prospect, signal and decision-maker research</li><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Personalized outreach for the test period</li><li><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>End-of-pilot review; no automatic rollover</li></ul><a class="btn ghost" href="#contact">Start a 30-day pilot</a><p class="small" style="margin:16px 0 0">This is the entry option, not the primary engagement. Limited onboarding applies because we keep research and messaging hands-on.</p></div></div></section>'''
          s, n = re.subn(r'<section class="section" id="pilot">.*?</section>', pilot, s, count=1, flags=re.S)
          assert n == 1, n

          # FAQ rewrite.
          faq = '''<section class="section" id="faq"><div class="wrap faqgrid"><div class="faqside"><div class="kicker reveal">Questions</div><h2 class="reveal" style="--d:1">FAQ</h2><p class="sub reveal" style="--d:2">Straight answers about the Snapshot, Pilot and Growth Partner engagement.</p><a class="btn ghost reveal" style="--d:3" href="#contact">Still unsure? Apply and ask <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div><div class="faq"><details class="reveal"><summary>Do you guarantee meetings?<span class="pm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></summary><div class="faq-a"><p>Growth Partner: yes—a defined number of qualified conversations / booked calls is agreed in writing. We do not guarantee closed revenue or clients; what happens after the call depends on your offer, follow-up and sales process.</p></div></details><details class="reveal" style="--d:1"><summary>Is this mass cold email?<span class="pm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></summary><div class="faq-a"><p>No. The approach is intentionally narrower: qualify accounts, verify relevant context, prioritize stronger opportunities, then use human-reviewed LinkedIn and email outreach to the appropriate decision-maker.</p></div></details><details class="reveal" style="--d:2"><summary>What is a buying signal?<span class="pm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></summary><div class="faq-a"><p>A signal is a research trigger, not proof of intent. We use it to form a better hypothesis about timing and verify the surrounding context before outreach.</p></div></details><details class="reveal" style="--d:3"><summary>What’s the difference between Snapshot, Pilot and Growth Partner?<span class="pm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></summary><div class="faq-a"><p><strong>Snapshot:</strong> free research sample with five potential clients, signals and contacts. <strong>Pilot:</strong> a one-time $750, 30-day test of the process. <strong>Growth Partner:</strong> the primary 180-day managed engagement combining signal-based outbound, founder LinkedIn and live pipeline visibility.</p></div></details><details class="reveal" style="--d:4"><summary>What happens after 30 days or during the 180-day term?<span class="pm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></summary><div class="faq-a"><p>Pilot clients review the data with us and can discuss Growth Partner if the fit is strong; there is no automatic rollover. Growth Partner runs for 180 days and includes a mid-point review to assess pipeline quality, responses and the plan for the second half.</p></div></details><details class="reveal" style="--d:5"><summary>Who is this built for?<span class="pm"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></summary><div class="faq-a"><p>Founder-led B2B web design and development agencies with strong delivery, meaningful project values, proof of work and capacity for additional good-fit clients.</p></div></details></div></div></section>'''
          s, n = re.subn(r'<section class="section" id="faq">.*?</section>', faq, s, count=1, flags=re.S)
          assert n == 1, n

          # At-a-glance and contact section positioning.
          s = re.sub(r'<section id="agency-summary".*?</section>', '''<section id="agency-summary" class="section" aria-labelledby="agency-summary-title" style="padding:32px 0 50px"><div class="wrap"><div class="card" style="padding:28px 32px"><div class="kicker">At a glance</div><h2 id="agency-summary-title" style="font-size:clamp(24px,3vw,34px)">What does SignalSourced do?</h2><p class="sub">SignalSourced is a Growth Partner for founder-led web design and development agencies. The primary 180-day engagement combines signal-based outbound, founder LinkedIn support and live pipeline visibility. Agencies can also start with a free five-account Snapshot or a one-time $750, 30-day Pilot. Growth Partner guarantees are tied to the qualified conversations / booked calls defined in the agreement—not closed clients or revenue.</p><p style="margin:16px 0 0"><a href="#growth" style="color:var(--accent);text-decoration:underline">Growth Partner</a> · <a href="#snapshot" style="color:var(--accent);text-decoration:underline">Free Snapshot</a> · <a href="#pilot" style="color:var(--accent);text-decoration:underline">30-day Pilot</a> · <a href="mailto:inquiries@signalsourced.com" style="color:var(--accent);text-decoration:underline">Contact us</a></p></div></div></section>''', s, count=1, flags=re.S)
          s = s.replace('<div class="kicker">Founding partner application</div><h2>Tell us where you want your <span class="accent">next good client</span> to come from.</h2><p class="sub">A few details are enough for us to understand your economics, capacity and ideal customer. If the pilot looks like a fit, the next step is a short plan for your market—not a generic sales deck.</p>', '<div class="kicker">Growth Partner application</div><h2>Build a pipeline you can <span class="accent">see before the quarter ends.</span></h2><p class="sub">Tell us about your agency, economics and ideal customer. We’ll assess whether the 180-day Growth Partner, the 30-day Pilot, or just the free Snapshot makes the most sense.</p>')
          s = s.replace('No spam. Your details are only used to review the application and respond about the pilot.', 'No spam. Your details are only used to review your request and respond about SignalSourced services.')
          s = s.replace('New SignalSourced Founding Partner Application', 'New SignalSourced Growth Partner Application')
          s = s.replace('Apply for the founding pilot ', 'Apply for Growth Partner ')
          s = s.replace('Application sent successfully. We’ll review the details and reply by email if the founding pilot looks like a fit. If we invite you to a discovery call, we’ll send you the booking link.', 'Application sent successfully. We’ll review the details and reply by email with the best next step—Growth Partner, Pilot, Snapshot, or an honest no-fit.')

          # Simple route choice in paid application form.
          marker = '<div class="field"><label for="team">Team size</label><select id="team" name="team"><option value="">Select</option><option>1</option><option>2–5</option><option>6–10</option><option>11–20</option><option>21+</option></select></div>'
          route = marker + '<div class="field"><label for="interest">Preferred starting point</label><select id="interest" name="interest"><option value="">Not sure yet</option><option>Growth Partner — 180 days</option><option>30-day Pilot — $750</option><option>Free Snapshot first</option></select></div>'
          assert marker in s
          s = s.replace(marker, route, 1)

          # JS and footer language.
          s = s.replace('Looks like a strong match for the founding pilot. Apply below and we will review it.', 'Looks like a strong match for Growth Partner. Apply below and we will review it.')
          s = s.replace('The pilot may not be the right fit yet. It works best for established agencies where one good project matters.', 'Growth Partner may not be the right fit yet. The Snapshot or Pilot may be a better starting point.')
          s = s.replace('<strong>SignalSourced</strong> · Signal-based outbound for B2B web agencies.', '<strong>SignalSourced</strong> · Growth Partner for founder-led web agencies: signal outbound + founder LinkedIn.')

          # Sanity checks
          must = ['Know what’s coming next quarter', 'SignalSourced Growth Partner', '$[TBD]', '30-day Pilot', 'Get your free Snapshot', 'snapshot-video.mp4', 'Growth Partner: yes', 'Privacy Notice', 'Website Terms']
          for item in must:
              assert item in s, item
          assert '2 FOUNDING PARTNER SPOTS' not in s
          p.write_text(s)
          print('Homepage updated.')
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reposition homepage around Growth Partner"
            git push
          fi
