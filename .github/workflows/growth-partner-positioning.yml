name: Apply Growth Partner positioning

on:
  push:
    paths:
      - '.github/workflows/growth-partner-positioning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage positioning
        run: python scripts/update_growth_partner.py
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reposition homepage around Growth Partner"
            git push
          fi
