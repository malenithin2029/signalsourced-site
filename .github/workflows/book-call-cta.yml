name: Switch primary CTA to Book a call

on:
  push:
    paths:
      - '.github/workflows/book-call-cta.yml'

permissions:
  contents: write

jobs:
  update-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update primary CTA copy and links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          cal = 'https://calendly.com/nithin-signalsourced/signalsourced-discovery-call'
          replacements = {
            '<a class="btn sm" href="#contact">Apply for Growth Partner <svg': f'<a class="btn sm" href="{cal}" target="_blank" rel="noopener noreferrer">Book a call <svg',
            '<a class="btn sm mobile-top-cta" href="#contact" aria-label="Apply for Growth Partner">Apply</a>': f'<a class="btn sm mobile-top-cta" href="{cal}" target="_blank" rel="noopener noreferrer" aria-label="Book a call">Book a call</a>',
            '<a class="btn" href="#contact">Apply for Growth Partner <svg': f'<a class="btn" href="{cal}" target="_blank" rel="noopener noreferrer">Book a call <svg',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Change primary CTA to Book a call"
          git push
