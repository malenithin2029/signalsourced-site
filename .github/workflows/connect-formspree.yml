name: Connect Formspree

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/connect-formspree.yml'

permissions:
  contents: write

jobs:
  patch-form:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Patch form
        run: python scripts/connect_formspree.py
      - name: Commit form connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect founding pilot form to Formspree"
          git push
