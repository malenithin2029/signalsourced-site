name: Fix duplicate Book a call
on:
  push:
    paths:
      - '.github/workflows/fix-duplicate-book-call.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile CTA visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.btn.sm{padding:10px 16px;font-size:14px;border-radius:10px}'
          new = old + '\n    .btn.mobile-top-cta{display:none}'
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected CSS rule not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Hide mobile Book a call CTA on desktop"
          git push