name: Apply SignalSourced SEO Upgrade

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-upgrade.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production source
        uses: actions/checkout@v4
      - name: Apply SEO and logo patch to current layout
        run: |
          sed -i 's|    <!-- APPLY -->|    <section class="cta" id="contact">|' scripts/seo_upgrade.py
          python scripts/seo_upgrade.py
      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html terms.html
          git diff --cached --quiet || git commit -m "Update radar identity, metadata and discoverable service details"
          git push
