name: Use LinkedIn logo everywhere
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unify-linkedin-logo.yml']
permissions:
  contents: write
jobs:
  unify-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Create images from supplied LinkedIn logo and update site
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, json, pathlib, re
          from PIL import Image
          # Cropped and scaled derivative of the actual image supplied by the owner.
          source = ''
          logo = Image.open(io.BytesIO(base64.b64decode(source))).convert('RGB')
          assert logo.size == (128,128), 'Logo asset corrupted'
          logo.resize((256,256),Image.Resampling.LANCZOS).save('brand-icon.png',optimize=True)
          logo.resize((180,180),Image.Resampling.LANCZOS).save('apple-touch-icon.png',optimize=True)
          logo.save('favicon.ico',sizes=[(16,16),(32,32),(48,48),(64,64)])
          src = pathlib.Path('index.html')
          html = src.read_text()
          assert 'href="/logo-mark.svg"' in html
          assert 'src="/logo-mark.svg"' in html
          html=html.replace('<link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />','<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" /><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />')
          html=html.replace('src="/logo-mark.svg"','src="/brand-icon.png?v=2"').replace('https://signalsourced.com/logo-mark.svg','https://signalsourced.com/brand-icon.png')
          assert 'logo-mark.svg' not in html
          src.write_text(html)
          for filename in ['privacy.html','terms.html']:
            page=pathlib.Path(filename)
            if not page.exists(): continue
            body=page.read_text()
            if '<a href="/">SignalSourced</a>' in body:
              body=body.replace('<a href="/">SignalSourced</a>','<a href="/" style="display:inline-flex;align-items:center;gap:8px"><img src="/brand-icon.png?v=2" width="28" height="28" alt="" style="border-radius:6px" />SignalSourced</a>')
            body=body.replace('<meta name="viewport" content="width=device-width,initial-scale=1">','<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.ico?v=2" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">')
            page.write_text(body)
          print('Updated matching logo, favicon, Apple icon and site references')
          PY
      - name: Commit matching logo and icon assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand-icon.png favicon.ico apple-touch-icon.png index.html privacy.html terms.html
          git diff --cached --quiet || git commit -m 'Use same LinkedIn radar artwork for site logo and browser icons'
          git push